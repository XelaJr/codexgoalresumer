name: Codex compatibility

# Weekly, against the latest Codex release:
# - schema: regenerate the database schemas from that release's source, build
#   a goal on them and run the suite (tests/compat_check.py);
# - real-codex: on Linux, macOS and Windows, let Codex itself create a goal in
#   its default CODEX_HOME (no API key needed, tests/real_codex_goal.py) and
#   check that where/list/brief find it without --home. `codex doctor` output
#   and the results are kept as artifacts.
# Opens (or updates) an issue when anything fails.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  schema:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.codex.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the latest Codex CLI
        id: codex
        run: |
          npm install -g @openai/codex
          version=$(codex --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Codex $version"
      - name: Fetch the matching Codex source
        id: src
        run: |
          tag="rust-v${{ steps.codex.outputs.version }}"
          if git clone --depth 1 --branch "$tag" --filter=blob:none --sparse https://github.com/openai/codex.git codex-src; then
            echo "rev=$tag" >> "$GITHUB_OUTPUT"
          else
            git clone --depth 1 --filter=blob:none --sparse https://github.com/openai/codex.git codex-src
            echo "rev=main@$(git -C codex-src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          git -C codex-src sparse-checkout set codex-rs/state
      - name: Check compatibility
        run: |
          set -o pipefail
          python tests/compat_check.py codex-src --rev "${{ steps.src.outputs.rev }}" | tee compat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-schema
          path: compat.txt
          if-no-files-found: ignore

  real-codex:
    name: real Codex · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the latest Codex CLI
        shell: bash
        run: |
          npm install -g @openai/codex
          codex --version
      - name: codex doctor
        shell: bash
        run: |
          mkdir -p out
          codex doctor > out/codex-doctor.txt 2>&1 || true
          cat out/codex-doctor.txt
      - name: Create a real goal in the default CODEX_HOME
        shell: bash
        run: |
          unset CODEX_HOME
          mkdir -p "$RUNNER_TEMP/proj"
          git -C "$RUNNER_TEMP/proj" init -q
          python tests/real_codex_goal.py "$(python -c 'import os; print(os.path.join(os.path.expanduser("~"), ".codex"))')" \
            "$RUNNER_TEMP/proj" --status blocked | tee out/thread-id.txt
          ls -la ~/.codex > out/codex-home-listing.txt 2>&1 || true
          cat out/codex-home-listing.txt
      - name: where / list / brief without --home
        shell: bash
        run: |
          set -o pipefail
          tid=$(tail -1 out/thread-id.txt | tr -d '\r')
          python scripts/codex_goals.py where | tee out/where.txt
          (cd "$RUNNER_TEMP/proj" && python "$GITHUB_WORKSPACE/scripts/codex_goals.py" list) | tee out/list.txt
          grep -q "${tid:0:8}" out/list.txt
          python scripts/codex_goals.py brief "$tid" | tee out/brief.txt
          grep -q "· blocked" out/brief.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-codex-${{ matrix.os }}
          path: out/

  wsl:
    name: real Codex · Windows + WSL
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3 git nodejs npm
      - name: Install Codex on Windows and in WSL
        shell: bash
        run: |
          npm install -g @openai/codex
          codex --version
      - name: Install Codex in WSL
        shell: wsl-bash {0}
        run: |
          npm install -g @openai/codex >/dev/null 2>&1 || sudo npm install -g @openai/codex
          codex --version
      - name: Codex on Windows creates a goal
        shell: bash
        run: |
          mkdir -p out "$RUNNER_TEMP/winproj"
          git -C "$RUNNER_TEMP/winproj" init -q
          python tests/real_codex_goal.py "$USERPROFILE/.codex" "$RUNNER_TEMP/winproj" --status blocked \
            --objective "Goal recorded on Windows" | tail -1 | tr -d '\r' > out/win-thread.txt
          cat out/win-thread.txt
      - name: Codex in WSL creates a goal
        shell: wsl-bash {0}
        run: |
          mkdir -p /tmp/wslproj && git -C /tmp/wslproj init -q
          python3 tests/real_codex_goal.py "$HOME/.codex" /tmp/wslproj --status paused \
            --objective "Goal recorded in WSL" | tail -1 > out/wsl-thread.txt
          cat out/wsl-thread.txt
      - name: "Claude Code in WSL, Codex on Windows"
        shell: wsl-bash {0}
        run: |
          set -eo pipefail
          tid=$(cat out/win-thread.txt | tr -d '\r')
          python3 scripts/codex_goals.py where | tee out/wsl-where.txt
          grep -q "/mnt/c/Users/" out/wsl-where.txt
          python3 scripts/codex_goals.py list --all | tee out/wsl-list.txt
          grep -q "${tid:0:8}" out/wsl-list.txt
          winproj=$(wslpath -u "$(cmd.exe /c echo %RUNNER_TEMP% 2>/dev/null | tr -d '\r')")/winproj
          (cd "$winproj" && python3 "$OLDPWD/scripts/codex_goals.py" list) | tee out/wsl-list-cwd.txt
          grep -q "${tid:0:8}" out/wsl-list-cwd.txt
          python3 scripts/codex_goals.py brief "$tid" | tee out/wsl-brief.txt
          grep -q "Goal recorded on Windows" out/wsl-brief.txt
      - name: "Claude Code on Windows, Codex in WSL"
        shell: bash
        run: |
          set -eo pipefail
          tid=$(cat out/wsl-thread.txt | tr -d '\r')
          python scripts/codex_goals.py where | tee out/win-where.txt
          grep -qi "wsl" out/win-where.txt
          python scripts/codex_goals.py list --all | tee out/win-list.txt
          grep -q "${tid:0:8}" out/win-list.txt
          python scripts/codex_goals.py brief "$tid" | tee out/win-brief.txt
          grep -q "Goal recorded in WSL" out/win-brief.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-codex-windows-wsl
          path: out/

  report:
    needs: [schema, real-codex, wsl]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Codex ${{ needs.schema.outputs.version }} compatibility check failed"
          body=$(printf 'The weekly check against the latest Codex (%s) failed.\n\nRun and artifacts: %s/%s/actions/runs/%s\n' \
            "${{ needs.schema.outputs.version }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
